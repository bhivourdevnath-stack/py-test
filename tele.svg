<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900"
     height="300"
     viewBox="0 0 900 300"
     role="img"
     aria-label="About me banner">

  <rect width="900" height="300" rx="12" fill="#020202"/>


  <defs>
    <clipPath id="about-me-typewriter-clip" clipPathUnits="userSpaceOnUse">
      <rect x="50" y="25" width="0" height="38">
        <animate attributeName="width"
                 values="0;530;530;0"
                 keyTimes="0;0.35;0.78;1"
                 dur="5s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#about-me-typewriter-clip)">
    <text x="50" y="55"
          fill="#ffffff"
          font-family="monospace, monospace"
          font-size="35">~$ Build Your Telegram Bot</text>
  </g>

  <!-- cursor -->
  <rect x="50" y="28" width="2" height="30" fill="#ffffff">
    <animate attributeName="x"
             values="50;590;590;50"
             keyTimes="0;0.35;0.78;1"
             dur="5s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;1;0;1"
             keyTimes="0;0.35;0.78;1"
             dur="0.9s"
             repeatCount="indefinite"/>
  </rect>

  <line x1="50" y1="75" x2="860" y2="75" stroke="#444444" stroke-width="1"/>

  <text x="50" y="140"
        fill="#cccccc"
        font-family="monospace, monospace"
        font-size="17">$ A beginner-friendly Telegram bot powered by AI that answers questions about you </text>


  <text x="50" y="170"
        fill="#cccccc"
        font-family="monospace, monospace"
        font-size="17">$ No high Telegram integration or coding experience needed, and build it in minutes </text>

  <text x="50" y="200"
        fill="#aaaaaa"
        font-family="monospace, monospace"
        font-size="17">$ Features pre-built commands, easy setup, and complete testing included.</text>

  <text x="50" y="230"
        fill="#aaaaaa"
        font-family="monospace, monospace"
        font-size="17">$ Perfect for beginner programmer and Python learners </text>
</svg>
